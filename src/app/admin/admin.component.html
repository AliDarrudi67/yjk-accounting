<div class="p-6">
    <!-- Header -->
    <div class="flex items-center justify-between mb-4">

        <!-- عنوان -->
        <h2 class="text-lg font-semibold text-gray-800">
            لیست کاربران
        </h2>

        <!-- دکمه افزودن -->
        <button (click)="showAdminForm()"
            class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white text-sm px-4 py-2 rounded-lg transition">

            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>

            افزودن کاربر
        </button>

    </div>


    <!-- جدول ادمین‌ها -->
    <div class="bg-white border border-gray-200 rounded-lg overflow-hidden shadow-sm">
        <div class="overflow-x-auto">

            <table class="min-w-full divide-y divide-gray-200">

                <thead class="bg-gray-50">
                    <tr>

                        <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">
                            نام کاربری
                        </th>

                        <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">
                            نقش
                        </th>

                        <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">
                            نام کامل
                        </th>

                        <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">
                            تاریخ ایجاد
                        </th>

                        <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">
                            عملیات
                        </th>

                    </tr>
                </thead>

                <tbody class="bg-white divide-y divide-gray-200">

                    <tr class="hover:bg-gray-50 transition-colors" *ngFor="let admin of admins">

                        <!-- نام کاربری -->
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="text-sm font-medium text-gray-900">
                                {{admin.username}}
                            </div>
                            <div class="text-xs text-gray-500">
                                ID: {{admin.id}}
                            </div>
                        </td>

                        <!-- نقش -->
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="px-2 py-1 text-xs rounded bg-blue-100 text-blue-700">
                                {{admin.role}}
                            </span>
                        </td>

                        <!-- نام کامل -->
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span>
                                {{admin.fullName}}
                            </span>
                        </td>

                        <!-- تاریخ ایجاد -->
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="text-sm text-gray-900">
                                {{admin.created | jalaliDate}}
                            </div>
                        </td>

                        <!-- عملیات -->
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium flex items-center gap-3">

                            <button class="text-indigo-600 hover:text-indigo-900" (click)="showAdminForm(admin)">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                    stroke-width="1.5" stroke="currentColor"
                                    class="w-5 h-5 text-gray-500 hover:text-blue-600 transition-colors duration-200 cursor-pointer">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L6.832 19.82a4.5 4.5 0 0 1-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 0 1 1.13-1.897L16.863 4.487Zm0 0L19.5 7.125" />
                                </svg>

                            </button>

                            <button class="text-indigo-600 hover:text-indigo-900" *ngIf="admin?.main!=='y'"
                                routerLink="/private/dashboard/admin_permission/{{admin?.id}}">
                                تنظیم دسترسی ها
                            </button>

                            <button class="text-red-600 hover:text-red-800" (click)="deleteAdmin(admin)">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                    stroke-width="1.5" stroke="currentColor"
                                    class="w-5 h-5 text-gray-500 hover:text-red-600 transition-colors duration-200 cursor-pointer">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
                                </svg>

                            </button>

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>
    </div>
</div>
