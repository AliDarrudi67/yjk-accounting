<div class="p-6">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
        <h2 class="text-xl font-bold text-gray-800">سطوح دسترسی ادمین (نام: {{ adminInfo?.admin?.fullName }})</h2>
        <div class="flex gap-2">
            <button (click)="toggleAll(true)"
                class="bg-green-100 hover:bg-green-200 text-green-700 px-4 py-2 rounded text-sm font-medium transition">
                انتخاب همه
            </button>
            <button (click)="toggleAll(false)"
                class="bg-red-100 hover:bg-red-200 text-red-700 px-4 py-2 rounded text-sm font-medium transition">
                حذف همه
            </button>
        </div>
    </div>

    <div *ngIf="data.length === 0" class="text-center py-10 text-gray-500">
        در حال بارگذاری لیست شرکت‌ها...
    </div>

    <div *ngFor="let company of data" class="mb-6 p-5 border border-gray-200 rounded-xl bg-white shadow-sm">
        <!-- هدر شرکت -->
        <div class="flex items-center gap-3 mb-4 pb-3 border-b border-gray-100">
            <input type="checkbox" [id]="'comp-' + company.id" [(ngModel)]="company.selected"
                (change)="toggleCompany(company)"
                class="w-5 h-5 text-blue-600 rounded focus:ring-blue-500 cursor-pointer">
            <label [for]="'comp-' + company.id" class="font-bold text-lg cursor-pointer text-gray-700">
                {{ company.name }}
            </label>
        </div>

        <!-- لیست حساب‌ها -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 pr-4">
            <div *ngFor="let acc of company.accounts"
                class="flex items-center gap-3 p-3 bg-gray-50 hover:bg-gray-100 rounded-lg transition border border-transparent hover:border-gray-200">
                <input type="checkbox" [id]="'acc-' + acc.id" [(ngModel)]="acc.selected"
                    (change)="toggleAccount(company)"
                    class="w-4 h-4 text-blue-500 rounded focus:ring-blue-400 cursor-pointer">
                <label [for]="'acc-' + acc.id" class="text-sm text-gray-600 cursor-pointer select-none">
                    {{ acc.name }}
                </label>
            </div>
        </div>
    </div>

    <div class="sticky bottom-6 mt-8">
        <button (click)="save()"
            class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold shadow-lg hover:bg-blue-700 active:transform active:scale-[0.98] transition-all">
            ذخیره تغییرات سطوح دسترسی
        </button>
    </div>
</div>
