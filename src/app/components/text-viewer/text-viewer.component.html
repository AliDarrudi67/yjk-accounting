<div class="p-6 bg-white rounded-2xl w-full max-w-lg">

    <div class="flex items-start gap-3 mb-5">
        <div class="w-10 h-10 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center shrink-0">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M8 10h8M8 14h5M7 4h10a2 2 0 012 2v14l-4-2-4 2-4-2-4 2V6a2 2 0 012-2z" />
            </svg>
        </div>

        <div>
            <h2 class="text-base font-semibold text-gray-800">
                توضیحات تراکنش
            </h2>
            <p class="text-xs text-gray-400 mt-1">
                متن توضیحات ثبت‌شده برای این تراکنش
            </p>
        </div>
    </div>

    <div class="rounded-xl bg-gray-50 border border-gray-100 p-4">
        <p class="text-sm text-gray-700 leading-7 whitespace-pre-line">
            {{ data
            || 'توضیحی برای این تراکنش ثبت نشده است.' }}
        </p>
    </div>

    <div class="flex justify-end mt-5">
        <button type="button" (click)="closeDialog()"
            class="px-4 py-2 rounded-lg bg-gray-100 text-gray-700 text-sm hover:bg-gray-200 transition">
            بستن
        </button>
    </div>

</div>
